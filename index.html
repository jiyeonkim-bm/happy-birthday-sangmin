<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상민님 생일 축하해요!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Chiron+GoRound+TC:wght@200..900&family=Nanum+Pen+Script&family=Gaegu&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Floating Decorative Circles -->
<div class="float-circle" style="width:200px;height:200px;background:var(--mint-200);top:10%;left:-60px;animation-delay:0s;"></div>
<div class="float-circle" style="width:150px;height:150px;background:var(--pink);top:40%;right:-40px;animation-delay:2s;"></div>
<div class="float-circle" style="width:120px;height:120px;background:var(--yellow);bottom:15%;left:10%;animation-delay:4s;"></div>
<div class="float-circle" style="width:180px;height:180px;background:var(--mint-100);bottom:5%;right:5%;animation-delay:1s;"></div>

<!-- Confetti Canvas -->
<canvas id="confetti-canvas"></canvas>

<!-- Navigation -->
<nav>
  <div class="nav-inner">
    <div class="nav-logo">HBD 상민</div>
    <button class="nav-tab active" data-page="countdown">카운트다운</button>
    <button class="nav-tab" data-page="rolling">롤링페이퍼</button>
    <button class="nav-tab" data-page="photo">사진</button>
    <button class="nav-tab" data-page="video">찬조영상</button>
  </div>
</nav>

<!-- ═══════ Countdown Page ═══════ -->
<main>
  <section id="page-countdown" class="page active">
    <div class="countdown-wrap" id="countdown-area">
      <div class="countdown-emoji">🎂</div>
      <h1 class="countdown-title">상민님의 생일까지</h1>
      <p class="countdown-subtitle">2026년 5월 3일</p>
      <div class="countdown-boxes">
        <div class="countdown-box">
          <div class="number" id="cd-days">--</div>
          <div class="label">Days</div>
        </div>
        <div class="countdown-box">
          <div class="number" id="cd-hours">--</div>
          <div class="label">Hours</div>
        </div>
        <div class="countdown-box">
          <div class="number" id="cd-mins">--</div>
          <div class="label">Min</div>
        </div>
        <div class="countdown-box">
          <div class="number" id="cd-secs">--</div>
          <div class="label">Sec</div>
        </div>
      </div>
      <div class="countdown-dday" id="cd-dday"></div>
    </div>
  </section>

  <!-- ═══════ Rolling Paper Page ═══════ -->
  <section id="page-rolling" class="page">
    <div class="section-header">
      <h2>상민님에게 보내는 롤링페이퍼</h2>
      <p>마음을 담아 한 장씩 전해요</p>
    </div>
    <div class="rolling-grid" id="rolling-grid"></div>
    <div class="rolling-actions">
      <button class="btn btn-mint" onclick="openWriteModal()">메시지 남기기 ✏️</button>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--gray-500);margin-top:12px;">메시지 편집/삭제 비밀번호: <b>0503</b></p>
  </section>

  <!-- ═══════ Video Page ═══════ -->
  <section id="page-video" class="page">
    <div class="video-section">
      <div class="section-header">
        <h2>찬조영상</h2>
        <p>상민님을 위한 특별한 영상</p>
      </div>
      <div class="video-wrap">
        <div id="yt-player"></div>
      </div>
    </div>
  </section>

  <!-- ═══════ Photo Page ═══════ -->
  <section id="page-photo" class="page">
    <div class="photo-section">
      <div class="section-header">
        <h2>생일 포토부스</h2>
        <p>함께 찍고 추억을 남겨요</p>
      </div>

      <div class="camera-wrap">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="photo-canvas"></canvas>
        <div class="camera-overlay">
          <button class="btn-shutter" id="btn-capture" title="촬영"></button>
        </div>
      </div>

      <div class="camera-actions">
        <button class="btn btn-outline" id="btn-camera-toggle">카메라 켜기</button>
      </div>

      <div class="gallery-divider"><span>갤러리</span></div>
      <div class="gallery-grid" id="gallery-grid">
        <div class="gallery-empty"><span>📷</span>아직 찍은 사진이 없어요</div>
      </div>
    </div>
  </section>
</main>

<!-- Rolling Paper Popup -->
<div class="rolling-popup-overlay" id="rolling-popup">
  <div class="rolling-popup-inner">
    <div class="rolling-popup-card" id="rolling-popup-card">
      <button class="rolling-popup-close" id="rolling-popup-close">&times;</button>
      <div class="card-emoji" id="rolling-popup-emoji"></div>
      <div class="card-msg" id="rolling-popup-msg"></div>
      <div class="card-from" id="rolling-popup-from"></div>
      <div class="popup-edit-actions" id="popup-edit-actions" style="display:none;margin-top:16px;justify-content:center;gap:8px;">
        <button class="btn btn-outline" id="btn-popup-edit" style="padding:8px 20px;font-size:13px;">편집</button>
        <button class="btn btn-outline" id="btn-popup-delete" style="padding:8px 20px;font-size:13px;color:#ef4444;border-color:#fca5a5;">삭제</button>
      </div>
    </div>
  </div>
</div>

<!-- Write Message Modal -->
<div class="write-overlay" id="write-overlay">
  <div class="write-card">
    <h3>상민님에게 메시지 남기기</h3>
    <div class="write-field">
      <label>이모지 선택</label>
      <div class="write-emoji-row" id="write-emoji-row"></div>
    </div>
    <div class="write-field">
      <label>이름</label>
      <input type="text" id="write-name" placeholder="이름을 입력하세요" maxlength="20">
    </div>
    <div class="write-field">
      <label>메시지</label>
      <textarea id="write-msg" placeholder="상민님에게 하고 싶은 말을 적어주세요!" maxlength="500"></textarea>
    </div>
    <div class="write-actions">
      <button class="btn btn-mint" id="btn-write-submit">남기기</button>
      <button class="btn btn-outline" onclick="closeWriteModal()">취소</button>
    </div>
  </div>
</div>

<!-- Photo Preview Popup -->
<div class="photo-preview-popup" id="photo-preview">
  <div class="preview-inner">
    <img id="preview-img" src="" alt="preview">
    <div class="preview-actions">
      <button class="btn btn-mint" id="btn-download">다운로드</button>
      <button class="btn btn-outline" id="btn-close-preview">닫기</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>

</body>
</html>
